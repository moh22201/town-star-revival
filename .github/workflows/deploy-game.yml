name: Deploy Qaryati game to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/game/**"
      - ".github/workflows/deploy-game.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the existing game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/game

      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
